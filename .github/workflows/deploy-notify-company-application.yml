name: Deploy Skill Link application email function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-notifications:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: iiaskaknyfenglihfrpo
    steps:
      - name: Check out application code
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy company application notification function only
        run: supabase functions deploy notify-company-application --remote "$PROJECT_REF" --no-verify-jwt --yes
